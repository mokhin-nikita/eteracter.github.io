<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Активности РСЧС</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 480px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
        .hidden { display: none; }
        label { display: block; margin: 0.6rem 0; }
        input[type="email"], input[type="password"] { width: 100%; padding: 0.5rem; font-size: 1rem; box-sizing: border-box; }
        button { margin: 0.3rem 0.3rem 0.3rem 0; padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; border: none; }
        .check-row { display: flex; align-items: center; gap: 0.6rem; padding: 0.8rem 0; border-bottom: 1px solid #ddd; }
        .check-row input { width: auto; }
        .check-row label { margin: 0; }
        #msg { margin: 0.6rem 0; font-size: 0.9rem; color: #b00020; }
        h2 { margin-bottom: 0.4rem; }
        #btn-google {
            background-image: linear-gradient(90deg,rgba(66, 133, 244, 1) 0%, rgba(233, 66, 53, 1) 33%, rgba(250, 187, 5, 1) 66%, rgba(52, 168, 83, 1) 100%);
            color: white;
        }
        #auth {
            background-color: #eee;
        }
        #btn-logout {
            background-color: #e32212;
            color: white;
        }
        #btn-register, #btn-login {
            background-color: #5a0;
            color: white;
        }
    </style>
</head>
<body>
    <div id="auth">
        <h2>Вход</h2>
        <label>Email <input type="email" id="email" autocomplete="email"></label>
        <label>Пароль <input type="password" id="password" autocomplete="current-password"></label>
        <div>
            <button id="btn-login">Войти</button>
            <button id="btn-register">Зарегистрироваться</button>
        </div>
        <button id="btn-google" style="margin-top:0.6rem">Войти через Google</button>
        <div id="msg"></div>
    </div>

    <div id="app" class="hidden">
        <h2>Активности РСЧС</h2>
        <div class="check-row">
            <input type="checkbox" id="rocket-danger">
            <label for="rocket-danger">Ракетная опасность</label>
        </div>
        <div class="check-row">
            <input type="checkbox" id="bpla-danger">
            <label for="bpla-danger">Опасность БПЛА</label>
        </div>
        <div id="status" style="font-size:0.85rem;color:#555;margin-top:0.4rem"></div>
        <button id="btn-logout" style="margin-top:1rem">Выйти</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/13.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/13.4.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore-compat.js"></script>
    <script>
        var firebaseConfig = {
            apiKey: "AIzaSyBWAwVnqGgj-MlbjMBWYiQTyP9EJC3z-J0",
            authDomain: "eteractercheck.firebaseapp.com",
            projectId: "eteractercheck",
            storageBucket: "eteractercheck.firebasestorage.app",
            messagingSenderId: "610952010672",
            appId: "1:610952010672:web:e812caf379d91f6a4b5475",
            measurementId: "G-58WXDPYKK2"
        };

        firebase.initializeApp(firebaseConfig);
        var auth = firebase.auth();
        var db = firebase.firestore();
        var googleProvider = new firebase.auth.GoogleAuthProvider();

        var el = {
            auth: document.getElementById("auth"),
            app: document.getElementById("app"),
            email: document.getElementById("email"),
            password: document.getElementById("password"),
            msg: document.getElementById("msg"),
            rocket: document.getElementById("rocket-danger"),
            bpla: document.getElementById("bpla-danger"),
            status: document.getElementById("status"),
            btnLogin: document.getElementById("btn-login"),
            btnRegister: document.getElementById("btn-register"),
            btnGoogle: document.getElementById("btn-google"),
            btnLogout: document.getElementById("btn-logout"),
        };

        function showMsg(text) { el.msg.textContent = text; }

        async function loadChecks(uid) {
            el.status.textContent = "Загрузка…";
            try {
                var snap = await db.collection("users").doc(uid).get();
                if (snap.exists) {
                    var data = snap.data();
                    el.rocket.checked = !!data.rocketDanger;
                    el.bpla.checked = !!data.bplaDanger;
                }
                el.status.textContent = "";
            } catch (e) {
                el.status.textContent = "Не удалось загрузить: " + e.message;
            }
        }

        async function saveCheck(field, checked, uid) {
            el.status.textContent = "Сохранение…";
            try {
                await db.collection("users").doc(uid).set({ [field]: checked }, { merge: true });
                el.status.textContent = "Сохранено";
            } catch (e) {
                el.status.textContent = "Ошибка сохранения: " + e.message;
            }
        }

        function onUser(user) {
            if (user) {
                el.auth.classList.add("hidden");
                el.app.classList.remove("hidden");
                loadChecks(user.uid);
            } else {
                el.app.classList.add("hidden");
                el.auth.classList.remove("hidden");
                el.rocket.checked = false;
                el.bpla.checked = false;
                el.status.textContent = "";
            }
        }
        auth.onAuthStateChanged(onUser);

        el.btnLogin.addEventListener("click", function () {
            showMsg("");
            auth.signInWithEmailAndPassword(el.email.value.trim(), el.password.value)
                .catch(function (e) { showMsg("Ошибка входа: " + e.message); });
        });

        el.btnRegister.addEventListener("click", function () {
            showMsg("");
            auth.createUserWithEmailAndPassword(el.email.value.trim(), el.password.value)
                .catch(function (e) { showMsg("Ошибка регистрации: " + e.message); });
        });

        el.btnGoogle.addEventListener("click", function () {
            showMsg("");
            auth.signInWithPopup(googleProvider)
                .catch(function (e) { showMsg("Вход через Google: " + e.message); });
        });

        el.btnLogout.addEventListener("click", function () {
            auth.signOut().catch(function (e) { showMsg("Ошибка выхода: " + e.message); });
        });

        el.rocket.addEventListener("change", function () {
            if (auth.currentUser) saveCheck("rocketDanger", el.rocket.checked, auth.currentUser.uid);
        });
        el.bpla.addEventListener("change", function () {
            if (auth.currentUser) saveCheck("bplaDanger", el.bpla.checked, auth.currentUser.uid);
        });
    </script>
</body>
</html>
